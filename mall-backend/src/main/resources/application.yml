server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: mall
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/mall_vue?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

mall:
  token-timeout-hours: 12
  upload-dir: ./uploads
  file-base-url: http://localhost:8080
  order:
    # RabbitMQ TTL + 死信队列：订单超时自动取消时间（分钟）
    timeout-minutes: 30
  alipay:
    # 演示环境模拟支付宝；接入真实支付宝时替换为网关地址与商户配置
    mock: true
    notify-url: http://localhost:8080/portal/alipay/notify
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:4173

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.macro.mall: info
